<!DOCTYPE html>
<html>
  
    
    
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>誠心 - Sincerity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Playfair+Display:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* === 金紙粗紙 (Bamboo Paper) === */
            /* 背景：金紙色 (帶暖黃的手作紙感) */
            --color-bg: #EBE1CD;
            /* 筊杯：臙脂紅 (您設定的深沈優雅紅) */
            --color-jiao: #9F353A;
            /* 輪廓：呂色 (漆器黑) */
            --color-outline: #2B2B2B;
            /* 陰影：暖卡其 (配合金紙背景微調，避免陰影髒掉) */
            --color-shadow: #D1C4B0;
            /* 文字：深褐 (墨色，配合暖背景) */
            --color-text: #5E4638;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .app-header {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .app-header h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.8rem;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .app-header .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.2rem;
            opacity: 0.6;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #canvas-container canvas {
            display: block;
        }

        .app-footer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .app-footer p {
            font-size: 1rem;
            letter-spacing: 0.3rem;
            opacity: 0.7;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(247, 242, 230, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .result-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .result-overlay.hidden {
            display: none;
        }

        .result-content {
            text-align: center;
            padding: 2rem;
        }

        .result-content h2 {
            font-size: 4rem;
            font-weight: 600;
            letter-spacing: 1.5rem;
            margin-bottom: 1rem;
            color: var(--color-jiao);
        }

        .result-content p {
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            line-height: 2;
            margin-bottom: 0.5rem;
        }

        .tap-hint {
            margin-top: 2rem;
            font-size: 0.9rem !important;
            opacity: 0.5;
            animation: pulse 2s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .app-header h1 {
                font-size: 1.5rem;
                letter-spacing: 0.5rem;
            }

            .app-header .subtitle {
                font-size: 0.8rem;
                letter-spacing: 0.15rem;
            }

            .app-footer p {
                font-size: 0.9rem;
                letter-spacing: 0.2rem;
            }

            .result-content h2 {
                font-size: 3rem;
                letter-spacing: 1rem;
            }

            .result-content p {
                font-size: 1rem;
                letter-spacing: 0.3rem;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" data-cfasync="false"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js" data-cfasync="false"></script>
<meta name="generator" content="Hexo 7.1.1"></head>

<body>
    <!-- 標題區 -->
    <header class="app-header">
        <h1>誠心</h1>
        <p class="subtitle">Sincerity</p>
    </header>
    <!-- 3D Canvas -->
    <div id="canvas-container"></div>
    <!-- 提示區 -->
    <footer class="app-footer">
        <p id="instruction-text">準備中 ...</p>
    </footer>
    <!-- 結果顯示層 -->
    <div id="result-overlay" class="result-overlay hidden">
        <div class="result-content">
            <h2 id="result-title"></h2>
            <p id="result-description"></p>
            <p class="tap-hint">點擊任意處繼續</p>
        </div>
    </div>
    <!-- 載入 CDN -->
    <script>
        window.addEventListener('load', function() {
            if (typeof THREE === 'undefined' && !document.querySelector('script[type="importmap"]')) {
                console.warn("警告：全域 THREE 尚未偵測到。");
            }
            const script = document.createElement('script');
            script.type = 'module';
            script.src = '../js/Sincerity.js';
            script.setAttribute('data-cfasync', 'false');
            document.body.appendChild(script);
        });
    </script>
</body>
  

  
</html>
